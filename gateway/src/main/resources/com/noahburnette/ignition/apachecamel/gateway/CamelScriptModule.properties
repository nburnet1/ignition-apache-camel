list.desc=Lists named Camel integrations on this Gateway.
list.returns=Sorted integration names, including disabled or failed integrations.
status.desc=Returns runtime state and diagnostics for one named Camel integration.
status.param.name=The exact integration name (native camel-route resource), not an individual route ID.
status.returns=A mapping containing name, state, diagnostics, per-route summaries, aggregate metrics and startupFailure guidance with bounded cause types. No exception messages or full endpoint URIs.
restart.desc=Queues a restart of one enabled integration and all its routes. Poll status for completion; counters reset on replacement.
restart.param.name=The exact integration name.
send.desc=Sends an InOnly exchange in a named Camel context. Submission is synchronous, not durable or fire-and-forget.
send.param.name=The exact integration name.
send.param.endpoint=The Camel endpoint URI, for example direct:submit.
send.param.payload=A JSON-compatible value or None.
send.param.headers=An optional mapping of JSON-compatible header values.
request.desc=Runs an InOut exchange and returns its body. Timeout behavior belongs to the route and endpoint.
request.param.name=The exact integration name.
request.param.endpoint=The Camel endpoint URI, for example direct:lookup.
request.param.payload=A JSON-compatible value or None.
request.param.headers=An optional mapping of JSON-compatible header values.
request.returns=The JSON-compatible response body, or None.
