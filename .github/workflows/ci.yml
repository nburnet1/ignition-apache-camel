name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test module
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python regression tests
        run: python -m unittest discover -s scripts -p "test_camel_*.py"

      - name: Build and test unsigned module
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verify module artifact
        run: |
          artifact="build/Ignition-Apache-Camel.unsigned.modl"
          if [ ! -s "$artifact" ]; then
            echo "::error::Expected unsigned module was not produced: $artifact"
            exit 1
          fi
          unzip -p "$artifact" module.xml | grep -q '<id>com.noahburnette.ignition.apachecamel</id>' || {
            echo "::error::module.xml has the wrong module ID"
            exit 1
          }
