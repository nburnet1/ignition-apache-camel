name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "gateway/src/main/resources/stubs/system/camel.pyi"
      - "gateway/src/main/resources/com/noahburnette/ignition/apachecamel/gateway/CamelScriptModule.properties"
      - "gateway/src/main/java/com/noahburnette/ignition/apachecamel/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "gateway/src/main/resources/stubs/system/camel.pyi"
      - "gateway/src/main/resources/com/noahburnette/ignition/apachecamel/gateway/CamelScriptModule.properties"
      - "gateway/src/main/java/com/noahburnette/ignition/apachecamel/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm --prefix docs ci

      - name: Select GitHub Pages path prefix
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repository_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "PATH_PREFIX=/$repository_name/" >> "$GITHUB_ENV"
          fi

      - name: Build documentation
        run: npm --prefix docs run docs:build

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
